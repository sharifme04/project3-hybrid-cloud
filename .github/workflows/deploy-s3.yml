name: Deploy Public Frontend to S3
on:
  push:
    branches: [ main ]
    paths:
      - 'public-frontend/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/project3-hybrid-cloud/public-frontend
            git pull origin main
            rm -rf node_modules package-lock.json
            npm install
            VITE_API_URL=https://no0gsx5di6.execute-api.us-east-1.amazonaws.com/prod ./node_modules/.bin/vite build
            aws s3 sync dist/ s3://task-frontend-sharif/ --delete