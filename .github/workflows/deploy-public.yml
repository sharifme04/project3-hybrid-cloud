name: Deploy Public Frontend to S3

on:
  push:
    branches: [ main ]
    paths:
      - 'public-frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build public frontend
        working-directory: ./public-frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://no0gsx5di6.execute-api.us-east-1.amazonaws.com/prod
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to S3
        run: aws s3 sync public-frontend/dist/ s3://task-frontend-sharif/ --delete